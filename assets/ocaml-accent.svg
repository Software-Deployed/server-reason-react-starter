<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="OCaml accent background">
  <defs>
    <!-- Subtle dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f1f1f"/>
      <stop offset="0.55" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#1b1b1b"/>
    </linearGradient>

    <!-- Slight texture lines to mimic the raster feel -->
    <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="transparent"/>
      <rect y="0" width="6" height="1" fill="rgba(255,255,255,0.05)"/>
      <rect y="3" width="6" height="1" fill="rgba(0,0,0,0.10)"/>
    </pattern>

    <!-- Soft shadow for the left badge -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Clip for the badge content -->
    <clipPath id="badgeClip">
      <rect x="60" y="45" width="210" height="210" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <!-- Background bar -->
  <rect x="0" y="0" width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#scanlines)" opacity="0.55"/>

  <!-- Left orange badge -->
  <rect x="60" y="45" width="210" height="210" rx="28" ry="28" fill="#d77a00" filter="url(#softShadow)"/>

  <!-- Camel silhouette (stylized) -->
  <g clip-path="url(#badgeClip)">
    <!-- Camel body -->
    <path
      d="M95 170
         C110 150, 135 145, 155 150
         C165 120, 195 110, 215 125
         C225 95, 255 95, 265 120
         C275 150, 255 165, 240 170
         C250 185, 250 205, 235 215
         C220 225, 200 220, 190 210
         C175 225, 150 230, 130 220
         C110 210, 105 195, 110 185
         C95 185, 85 180, 95 170 Z"
      fill="#d9d9d9"
      opacity="0.95"
    />
    <!-- Neck + head -->
    <path
      d="M210 150
         C220 140, 235 135, 250 140
         C265 145, 270 160, 260 170
         C250 180, 235 180, 225 172
         C220 168, 215 160, 210 150 Z"
      fill="#d9d9d9"
      opacity="0.95"
    />
    <!-- Legs -->
    <path d="M135 210 L150 210 L150 245 L138 245 Z" fill="#d9d9d9" opacity="0.95"/>
    <path d="M175 212 L190 212 L190 248 L178 248 Z" fill="#d9d9d9" opacity="0.95"/>
    <path d="M215 210 L230 210 L230 245 L218 245 Z" fill="#d9d9d9" opacity="0.95"/>

    <!-- Small cutout to suggest the original logo's negative space -->
    <path
      d="M120 175
         C135 165, 155 165, 170 175
         C155 185, 135 188, 120 175 Z"
      fill="#cfcfcf"
      opacity="0.55"
    />
  </g>

  <!-- OCaml text -->
  <g transform="translate(320, 0)">
    <text
      x="0"
      y="195"
      font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
      font-size="140"
      font-weight="700"
      letter-spacing="1"
      fill="#e6e6e6"
      opacity="0.95"
    >OCaml</text>

    <!-- Subtle highlight to give a slightly embossed look -->
    <text
      x="0"
      y="192"
      font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
      font-size="140"
      font-weight="700"
      letter-spacing="1"
      fill="rgba(255,255,255,0.10)"
    >OCaml</text>
  </g>
</svg>
