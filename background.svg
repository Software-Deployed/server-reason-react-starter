    <path d="M30 20c0 2-1 4-2 6-1 1-2 2-4 2-2 0-4-1-6-2-1 0-2 0-3-1-1-1-1-2 0-3 1-1 2-1 3 0 1 1 2 1 3 1 2-1 4-2 6-2 2 0 3 1 5 2 1 0 2 0 3-1 1-1 1-2 0-3-1-1-2-1-3 0-1 1-2 1-3 1-1-1-2-2zm-20 0c0 2 1 4 2 6 1 1 2 2 4 2 2 0 4-1 6-2 1 0 2 0 3-1 1-1 1-2 0-3-1-1-2-1-3 0-1 1-2 1-3 1-2-1-4-2-6-2-2 0-3 1-5 2-1 0-2 0-3 1-1 1-1 2 0 3 1 1 2 1 3 0 1-1 2-1 3-1 1 1 2 2z"/>
